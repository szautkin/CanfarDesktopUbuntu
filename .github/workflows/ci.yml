name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libcfitsio-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      # No `--features fits` anywhere below: it is a DEFAULT feature now, so
      # these are the exact commands README and CONTRIBUTING tell a contributor
      # to run. CI passing while the documented command produced a different
      # (and quietly crippled) binary is how that divergence went unnoticed.
      - name: Clippy
        run: cargo clippy -- -D warnings -A dead_code

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      # The opt-out path packagers use when cfitsio is unavailable. Only a
      # compile check — without cfitsio there is no FITS to exercise — but it
      # keeps the `#[cfg(not(feature = "fits"))]` arms from rotting.
      - name: Check the build without cfitsio
        run: cargo check --no-default-features --all-targets
