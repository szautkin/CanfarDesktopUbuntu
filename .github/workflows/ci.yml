name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libcfitsio-dev pkg-config

      # Pinned, and equal to rust-toolchain.toml, so a green local run is the
      # same check as a green CI run. A test fails if the two drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      # No `--features fits` anywhere below: it is a DEFAULT feature now, so
      # these are the exact commands README and CONTRIBUTING tell a contributor
      # to run. CI passing while the documented command produced a different
      # (and quietly crippled) binary is how that divergence went unnoticed.
      # `--all-targets` so the ~1,070 tests are linted too. Without it clippy
      # sees only the binary, and three lints sat unnoticed in test code that
      # `cargo test` happily compiled — the same shape as the `--features fits`
      # divergence above: a gate that checks less than the repo contains.
      # `dead_code` is no longer suppressed in the shipping configuration. It
      # was, on the grounds that "some of the surface is live only under one
      # feature configuration" — true of the no-default-features build below,
      # and an 89-warning blanket over the default one. Under that blanket:
      # the function that gives a notebook cell the keyboard, the two that
      # would have told an agent who is signed in, a proposal-budget check
      # whose tests passed on a copy of the code the router did not run, and
      # two whole reference features whose halves shipped uncalled.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      # The opt-out path packagers use when cfitsio is unavailable. Only a
      # compile check — without cfitsio there is no FITS to exercise — but it
      # keeps the `#[cfg(not(feature = "fits"))]` arms from rotting.
      # `-A dead_code` genuinely applies HERE: with the fits feature off, the
      # code behind it is unreachable and says so.
      - name: Check the build without cfitsio
        run: cargo check --no-default-features --all-targets
      # The desktop entry and the AppStream metainfo are what a software centre
      # reads. Neither is compiled, so nothing else would notice them breaking.
      - name: Validate the desktop entry and AppStream metainfo
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate data/net.canfar.Verbinal.desktop
          appstreamcli validate data/net.canfar.Verbinal.metainfo.xml
