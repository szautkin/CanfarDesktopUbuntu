name: Release

on:
  push:
    tags: ["v*"]

# Actions are on their node24 majors. The node20 runtime they used before is
# past end-of-life on GitHub's runners, and a deprecated runtime is first a
# warning on every run and then a failure on a morning nobody chose.

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libcfitsio-dev pkg-config

      # Pinned, and equal to rust-toolchain.toml, so a green local run is the
      # same check as a green CI run. A test fails if the two drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: verbinal-deb
          path: target/debian/*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
          generate_release_notes: true

  build-arch:
    name: Build Arch package and repo
    runs-on: ubuntu-latest
    # Arch's own image, because the package has to be built against the
    # libraries it will be installed beside. A gtk4 built on Ubuntu is not the
    # gtk4 pacman will resolve to.
    container: archlinux:base-devel
    # Lifted to the job, because a step's `if` cannot see the `secrets`
    # context — GitHub's context-availability rules exclude it there, and a
    # workflow that uses it fails to PARSE rather than to run: no jobs, no
    # logs, and the run listed by filename because its `name:` was never read.
    # `env` is available in a step's `if`; a secret routed through it is the
    # documented way to ask "was this configured?".
    env:
      SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
      SIGNING_KEY_PASSPHRASE: ${{ secrets.ARCH_SIGNING_KEY_PASSPHRASE }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cargo pkgconf gtk4 libadwaita cfitsio

      - uses: actions/checkout@v7

      # makepkg refuses to run as root, by design.
      - name: Create a build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build the package
        run: |
          cp packaging/arch/PKGBUILD /home/builder/
          chown -R builder:builder /home/builder
          cd /home/builder
          sudo -u builder makepkg --syncdeps --noconfirm --clean

      # Signed, because a repo that serves binaries over a URL the user pasted
      # into pacman.conf is asking to be trusted, and `SigLevel = Optional
      # TrustAll` is that trust granted to whoever holds the host. Absent the
      # key the packages are still built — the release simply carries no repo.
      - name: Sign the package
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | gpg --batch --import
          cd /home/builder
          for pkg in *.pkg.tar.zst; do
            echo "$SIGNING_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --no-armor "$pkg"
          done

      # The database pacman actually reads. `repo-add` writes `.db` and
      # `.files` as symlinks to the tarballs; a release asset cannot be a
      # symlink, so both names are uploaded with the same bytes.
      - name: Build the repository index
        run: |
          mkdir -p /tmp/repo
          cp /home/builder/*.pkg.tar.zst /tmp/repo/
          cp /home/builder/*.sig /tmp/repo/ 2>/dev/null || true
          cd /tmp/repo
          repo-add verbinal.db.tar.gz verbinal-*.pkg.tar.zst
          # repo-add writes `.db` and `.files` as SYMLINKS to the tarballs, so
          # copying onto them copies a file onto its own target and fails. The
          # symlink has to go first — a release asset cannot be one anyway, and
          # pacman asks for `verbinal.db` by name.
          rm -f verbinal.db verbinal.files
          cp verbinal.db.tar.gz verbinal.db
          cp verbinal.files.tar.gz verbinal.files
          rm -f verbinal.db.tar.gz.old verbinal.files.tar.gz.old
          ls -la

      - name: Attach the package and repository to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            /tmp/repo/verbinal-*.pkg.tar.zst
            /tmp/repo/verbinal-*.pkg.tar.zst.sig
            /tmp/repo/verbinal.db
            /tmp/repo/verbinal.db.tar.gz
            /tmp/repo/verbinal.files
            /tmp/repo/verbinal.files.tar.gz
