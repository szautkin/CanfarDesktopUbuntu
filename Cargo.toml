[package]
name = "verbinal"
version = "1.4.2"
edition = "2021"
description = "Verbinal - a CANFAR Science Portal companion for Linux"
license = "AGPL-3.0"
authors = ["Serhii Zautkin"]
repository = "https://github.com/szautkin/CanfarDesktopUbuntu"
homepage = "https://verbinal.com"
readme = "README.md"
keywords = ["canfar", "astronomy", "science", "gtk4"]
categories = ["science", "gui"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
# "stream" so an upload can be a streamed body: without it the only way to
# PUT a file is to hand reqwest a Vec<u8>, i.e. the whole file in memory.
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "io-std", "fs"] }
# ReceiverStream: turns the upload reader's channel into the stream reqwest
# wants. Tokio's own crate, and the only thing used from it.
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
keyring = { version = "3", features = ["linux-native"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
once_cell = "1"
url = "2"
urlencoding = "2"
flate2 = "1"
tar = "0.4"
tempfile = "3"
base64 = "0.22"
fitsio = { version = "0.21", optional = true }
fitsio-sys = { version = "0.5", optional = true }
cairo-rs = { version = "0.20", features = ["v1_16", "pdf", "png"] }
# GL loader for the cube-viewer volume ray-marcher (gtk::GLArea + GLSL 330).
epoxy = "0.1"
gl = "0.14"
libloading = "0.8"

[features]
# `fits` is ON by default: this is a CADC/CANFAR client, and without cfitsio it
# cannot open a single FITS file — the FITS viewer, the cube viewer and the
# shape sniff all degrade to errors or "not FITS". CI and the release workflow
# always passed `--features fits`, but README and CONTRIBUTING document a plain
# `cargo build`, so anyone following them got a quietly crippled binary.
#
# The feature is kept so a build without libcfitsio-dev is still possible via
# `--no-default-features`, for packaging environments that cannot supply it.
default = ["fits"]
fits = ["fitsio", "fitsio-sys"]

[package.metadata.deb]
maintainer = "Serhii Zautkin"
copyright = "2025 Serhii Zautkin"
section = "science"
priority = "optional"
depends = "libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.4), libglib2.0-0 (>= 2.76), libcfitsio9 | libcfitsio10"
# Recommended, not required: GTK's media backend is what plays the agent cues,
# and an app that refused to install without it would be trading a working app
# for a ding. Without it `ui::sound` is silent and nothing else changes.
recommends = "libgtk-4-media-gstreamer"
assets = [
    ["target/release/verbinal", "usr/bin/", "755"],
    ["data/net.canfar.Verbinal.desktop", "usr/share/applications/", "644"],
    ["data/net.canfar.Verbinal.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/hicolor/16x16/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/icons/hicolor/24x24/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/icons/hicolor/32x32/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/icons/hicolor/48x48/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/icons/hicolor/64x64/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/icons/hicolor/128x128/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/icons/hicolor/256x256/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/icons/hicolor/512x512/apps/net.canfar.Verbinal.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["assets/icons/hicolor/scalable/apps/net.canfar.Verbinal.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/icons/hicolor/symbolic/apps/verbinal-agent-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["assets/sounds/agent-start.wav", "usr/share/verbinal/sounds/", "644"],
    ["assets/sounds/agent-stop.wav", "usr/share/verbinal/sounds/", "644"],
    ["README.md", "usr/share/doc/verbinal/", "644"],
    ["LICENSE", "usr/share/doc/verbinal/", "644"],
]
